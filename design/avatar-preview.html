<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Seva Jump avatar poses</title>
<style>body{font:16px system-ui;background:#fff8e9;color:#24483f;margin:24px}h1{font-size:26px}.row{display:flex;flex-wrap:wrap;gap:12px}figure{margin:0;text-align:center;background:#dceff0;border-radius:12px;padding:10px}canvas{display:block;width:150px;height:180px}button{padding:10px;margin-bottom:16px}body.dark figure{background:#243549}</style>
<h1>Updated Seva Jump avatars</h1><p>Five consistent poses per character. Pink layered pagg and turquoise/magenta clothing for the girl; blue angular pagg and saffron/blue clothing for the boy. Both wear a steel kara.</p><button onclick="document.body.classList.toggle('dark')">Toggle dark backdrop</button><main></main>
<script>
const frames={Jump:[80,0,360,545],Descent:[545,0,450,512],Net:[1080,65,390,465],'Push-off':[70,565,395,445],Apex:[565,512,410,505]};
for(const who of ['girl','boy']){const heading=document.createElement('h2');heading.textContent=who==='girl'?'Girl':'Boy';document.querySelector('main').append(heading);const row=document.createElement('div');row.className='row';document.querySelector('main').append(row);const im=new Image();im.onload=()=>{for(const [name,[x,y,w,h]] of Object.entries(frames)){const figure=document.createElement('figure'),c=document.createElement('canvas'),label=document.createElement('figcaption');c.width=300;c.height=360;const ctx=c.getContext('2d');if(who==='boy'){ctx.translate(300,0);ctx.scale(-1,1)}ctx.drawImage(im,x,y,w,h,150-w*.3,330-h*.6,w*.6,h*.6);label.textContent=name;figure.append(c,label);row.append(figure)}};im.src=`../assets/player-${who}-poses-v2.png`;}
</script></html>
